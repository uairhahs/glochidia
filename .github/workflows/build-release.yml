name: Build and Release Static Binaries
# trunk-ignore-all(yamllint/quoted-strings)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g., latest, v1.0.0)"
        required: true
        default: "latest"
  push:
    branches:
      - master
    tags:
      - "v*"

env:
  REPO_VERSION: "1.0.0"
  CARGO_TERM_COLOR: always

jobs:
  build-rust-musl:
    name: Build Rust Tools (musl)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool:
          - name: gpm
            description: "Glochidia Package Manager"
            license: "MIT OR Apache-2.0"
            source_url: "https://github.com/${{ github.repository }}"
            working_dir: gpm
            version: ""
            git_ref: ""
            repo_url: ""
            binary_name: ""
            build_cmd: ""
          - name: starship
            description: "Cross-shell prompt"
            license: "ISC"
            source_url: "https://github.com/starship/starship"
            repo_url: "https://github.com/starship/starship"
            build_cmd: "cargo build --release --no-default-features --features battery"
            version: ""
            git_ref: ""
            working_dir: ""
            binary_name: ""
          - name: set_locale
            description: "Locale management utilities (set_locale, locale-gen)"
            license: "MIT OR Apache-2.0"
            source_url: "https://github.com/${{ github.repository }}"
            working_dir: glochidia-locale
            binary_name: "set_locale"
            version: ""
            git_ref: ""
            repo_url: ""
            build_cmd: ""

    env:
      TOOL_NAME: ${{ matrix.tool.name }}
      SOURCE_URL: ${{ matrix.tool.source_url }}
      REPO_URL: ${{ matrix.tool.repo_url }}
      TOOL_VERSION: ${{ matrix.tool.version }}
      GIT_REF: ${{ matrix.tool.git_ref }}
      WORKING_DIR: ${{ matrix.tool.working_dir }}
      BUILD_CMD: ${{ matrix.tool.build_cmd }}
      BINARY_NAME: ${{ matrix.tool.binary_name }}

    # Pinned toolchain image; bump deliberately (keep in sync with grow_glochidium.sh)
    container:
      image: rust:1.99-alpine3.24
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install GNU tar for caching
        run: apk add --no-cache tar bash

      - name: Fetch latest release version
        id: fetch-version
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${WORKING_DIR}" ]; then
            # In-repo crate: version from Cargo.toml, cache keyed on the source contents
            # so any source change triggers a rebuild
            VERSION=$(sed -n 's/^version *= *"\(.*\)"/\1/p' "${WORKING_DIR}/Cargo.toml" | head -n1)
            SRC_HASH=$(find "${WORKING_DIR}" -type f -not -path '*/target/*' | sort | xargs sha256sum | sha256sum | cut -c1-16)
            CACHE_ID="${VERSION}-${SRC_HASH}"
          else
            VERSION=$(bash scripts/fetch-version.sh "${TOOL_NAME}" "${SOURCE_URL}" "${REPO_URL}" "${TOOL_VERSION}" "${GIT_REF}")
            CACHE_ID="${VERSION}"
          fi
          echo "version=${VERSION:-unknown}" >> "$GITHUB_OUTPUT"
          echo "cache_id=${CACHE_ID}" >> "$GITHUB_OUTPUT"

      # Skipped when the version is unknown, so the binary is rebuilt instead of reusing
      # a cache entry that would never be invalidated
      - name: Cache compiled binary
        id: cache-binary
        if: steps.fetch-version.outputs.version != 'unknown'
        uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.tool.name }}-bin
            ${{ matrix.tool.name }}.version
          key: ${{ runner.os }}-binary-${{ matrix.tool.name }}-${{ steps.fetch-version.outputs.cache_id }}-musl

      - name: Install build dependencies
        run: apk add --no-cache git musl-dev file cmake make gcc g++ linux-headers bash

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Cache cargo registry
        if: steps.cache-binary.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        if: steps.cache-binary.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        if: steps.cache-binary.outputs.cache-hit != 'true' && matrix.tool.working_dir != ''
        shell: bash
        run: cd "${WORKING_DIR}" && cargo test --locked --target x86_64-unknown-linux-musl

      - name: Build ${{ matrix.tool.name }}
        if: steps.cache-binary.outputs.cache-hit != 'true'
        shell: bash
        env:
          FETCHED_VERSION: ${{ steps.fetch-version.outputs.version }}
        run: |
          bash scripts/build-rust-tool.sh \
            "${TOOL_NAME}" \
            "${SOURCE_URL}" \
            "${WORKING_DIR}" \
            "${BUILD_CMD}" \
            "${BINARY_NAME}" \
            "${FETCHED_VERSION}" \
            "${REPO_VERSION}" \
            "x86_64-unknown-linux-musl"

      - name: Verify static binary
        if: steps.cache-binary.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/verify-binary.sh "${TOOL_NAME}-bin" "${TOOL_NAME}"

      - name: Finalize version metadata
        shell: bash
        env:
          FETCHED_VERSION: ${{ steps.fetch-version.outputs.version }}
        run: |
          bash scripts/finalize-version.sh \
            "${TOOL_NAME}" \
            "${TOOL_VERSION}" \
            "${FETCHED_VERSION}" \
            "${REPO_VERSION}" \
            "${WORKING_DIR}"

      - name: Upload artifact with metadata
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tool.name }}
          path: |
            ${{ matrix.tool.name }}-bin
            ${{ matrix.tool.name }}.version

  build-rust-gnu:
    name: Build Rust Tools (gnu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool:
          - name: msedit
            description: "Text editor for terminals"
            license: "MIT"
            source_url: "https://github.com/microsoft/edit"
            repo_url: "https://github.com/microsoft/edit"
            binary_name: "edit"
            build_cmd: "cargo build --all-features --release"
            version: ""
            git_ref: ""
            working_dir: ""
            target: "x86_64-unknown-linux-gnu"

    env:
      TOOL_NAME: ${{ matrix.tool.name }}
      SOURCE_URL: ${{ matrix.tool.source_url }}
      REPO_URL: ${{ matrix.tool.repo_url }}
      TOOL_VERSION: ${{ matrix.tool.version }}
      GIT_REF: ${{ matrix.tool.git_ref }}
      WORKING_DIR: ${{ matrix.tool.working_dir }}
      BUILD_CMD: ${{ matrix.tool.build_cmd }}
      BINARY_NAME: ${{ matrix.tool.binary_name }}
      TARGET: ${{ matrix.tool.target }}

    # Pinned toolchain image; bump deliberately (keep in sync with grow_glochidium.sh)
    container:
      image: rust:1.99-slim-bookworm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: apt-get update && apt-get install -y build-essential libicu-dev git pkg-config file

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Fetch latest release version
        id: fetch-version
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(scripts/fetch-version.sh "${TOOL_NAME}" "${SOURCE_URL}" "${REPO_URL}" "${TOOL_VERSION}" "${GIT_REF}")
          echo "version=${VERSION:-unknown}" >> "$GITHUB_OUTPUT"

      # Skipped when the version is unknown, so the binary is rebuilt instead of reusing
      # a cache entry that would never be invalidated
      - name: Cache compiled binary
        id: cache-binary
        if: steps.fetch-version.outputs.version != 'unknown'
        uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.tool.name }}-bin
            ${{ matrix.tool.name }}.version
          key: ${{ runner.os }}-binary-${{ matrix.tool.name }}-${{ steps.fetch-version.outputs.version }}-gnu

      - name: Cache cargo registry
        if: steps.cache-binary.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        if: steps.cache-binary.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Build ${{ matrix.tool.name }}
        if: steps.cache-binary.outputs.cache-hit != 'true'
        shell: bash
        env:
          FETCHED_VERSION: ${{ steps.fetch-version.outputs.version }}
        run: |
          scripts/build-rust-tool.sh \
            "${TOOL_NAME}" \
            "${SOURCE_URL}" \
            "${WORKING_DIR}" \
            "${BUILD_CMD}" \
            "${BINARY_NAME}" \
            "${FETCHED_VERSION}" \
            "${REPO_VERSION}" \
            "${TARGET}"

      # glibc-linked on purpose for ZimaOS compatibility, so dynamic linking is allowed
      - name: Verify binary linkage
        if: steps.cache-binary.outputs.cache-hit != 'true'
        shell: bash
        run: scripts/verify-binary.sh "${TOOL_NAME}-bin" "${TOOL_NAME}" allow-dynamic

      - name: Finalize version metadata
        shell: bash
        env:
          FETCHED_VERSION: ${{ steps.fetch-version.outputs.version }}
        run: |
          scripts/finalize-version.sh \
            "${TOOL_NAME}" \
            "${TOOL_VERSION}" \
            "${FETCHED_VERSION}" \
            "${REPO_VERSION}" \
            "${WORKING_DIR}"

      - name: Upload artifact with metadata
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tool.name }}
          path: |
            ${{ matrix.tool.name }}-bin
            ${{ matrix.tool.name }}.version

  build-c-tools:
    name: Build C/C++ Tools
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool:
          - name: make
            description: "GNU Make build tool"
            license: "GPL-3.0-or-later"
            source_url: "https://ftp.gnu.org/gnu/make/make-4.4.1.tar.gz"
            source_sha256: "dd16fb1d67bfab79a72f5e8390735c49e3e8e70b4945a15ab1f81ddb78658fb3"
            build_cmd: "./configure LDFLAGS=-static && make -j$(nproc)"
            version: ""
            git_ref: ""
          - name: gawk
            description: "GNU Awk text processing"
            license: "GPL-3.0-or-later"
            source_url: "https://ftp.gnu.org/gnu/gawk/gawk-5.3.2.tar.xz"
            source_sha256: "f8c3486509de705192138b00ef2c00bbbdd0e84c30d5c07d23fc73a9dc4cc9cc"
            build_cmd: "./configure LDFLAGS=-static && make -j$(nproc)"
            version: ""
            git_ref: ""
          - name: ble.sh
            description: "Bash Line Editor"
            license: "BSD-3-Clause"
            source_url: "https://github.com/akinomyoga/ble.sh"
            build_cmd: "make"
            version: ""
            # ble.sh publishes development builds from master; pin a known-good commit
            git_ref: "152942758f567e51fd17bdc7b3783d27b3c476aa"
            source_sha256: ""
          - name: fastfetch
            description: "System information tool"
            license: "MIT"
            source_url: "https://github.com/fastfetch-cli/fastfetch"
            build_cmd: "cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXE_LINKER_FLAGS=-static -DENABLE_SYSTEM_YYJSON=OFF -DENABLE_DIRECTWRITE=OFF -DENABLE_XRANDR=OFF -DENABLE_X11=OFF -DENABLE_WAYLAND=OFF -DENABLE_GIO=OFF -DENABLE_DCONF=OFF -DENABLE_DBUS=OFF -DENABLE_XFCONF=OFF -DENABLE_SQLITE3=OFF -DENABLE_IMAGEMAGICK=OFF -DENABLE_CHAFA=OFF -DENABLE_ZLIB=OFF -DENABLE_EGL=OFF -DENABLE_GLX=OFF -DENABLE_OSMESA=OFF -DENABLE_OPENCL=OFF -DENABLE_VULKAN=OFF -DENABLE_RPM=OFF -DENABLE_DRM=OFF -DENABLE_FREETYPE=OFF && cmake --build build --target fastfetch"
            version: ""
            git_ref: ""
            source_sha256: ""
    env:
      TOOL_NAME: ${{ matrix.tool.name }}
      SOURCE_URL: ${{ matrix.tool.source_url }}
      SOURCE_SHA256: ${{ matrix.tool.source_sha256 }}
      TOOL_VERSION: ${{ matrix.tool.version }}
      GIT_REF: ${{ matrix.tool.git_ref }}
      BUILD_CMD: ${{ matrix.tool.build_cmd }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Git sources build this resolved version: git_ref if pinned, else the latest release tag
      - name: Fetch latest release version
        id: fetch-version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(bash scripts/fetch-version.sh "${TOOL_NAME}" "${SOURCE_URL}" "" "${TOOL_VERSION}" "${GIT_REF}")
          echo "version=${VERSION:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Build ${{ matrix.tool.name }}
        env:
          FETCHED_VERSION: ${{ steps.fetch-version.outputs.version }}
        run: |
          bash scripts/build-c-tool.sh \
            "${TOOL_NAME}" \
            "${SOURCE_URL}" \
            "${BUILD_CMD}" \
            "${TOOL_VERSION}" \
            "${FETCHED_VERSION}"

      - name: Verify static binary
        run: bash scripts/verify-binary.sh "${TOOL_NAME}-bin" "${TOOL_NAME}"

      - name: Finalize version metadata
        env:
          FETCHED_VERSION: ${{ steps.fetch-version.outputs.version }}
        run: |
          bash scripts/finalize-version.sh \
            "${TOOL_NAME}" \
            "${TOOL_VERSION}" \
            "${FETCHED_VERSION}" \
            "${REPO_VERSION}" \
            ""

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tool.name }}
          path: |
            ${{ matrix.tool.name }}-bin
            ${{ matrix.tool.name }}.version

  generate-manifest:
    name: Generate Manifest and Create Release
    needs: [build-rust-musl, build-rust-gnu, build-c-tools]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare binaries
        run: |
          mkdir -p release-files versions
          echo "Preparing binaries..."
          for dir in artifacts/*/; do
            tool=$(basename "$dir")
            if [ -f "$dir/${tool}-bin" ]; then
              mv "$dir/${tool}-bin" "release-files/${tool}"
              echo "  - $tool"
            fi
            if [ -f "$dir/${tool}.version" ]; then
              mv "$dir/${tool}.version" "versions/${tool}.version"
            fi
            # Handle glochidia-locale's additional binaries
            if [ -f "$dir/set_locale-bin" ]; then
              mv "$dir/set_locale-bin" "release-files/set_locale"
              echo "  - set_locale"
            fi
            if [ -f "$dir/set_locale.version" ]; then
              mv "$dir/set_locale.version" "versions/set_locale.version"
            fi
          done
          chmod +x release-files/*
          ls -lh release-files/
          echo "Versions collected:"
          ls -lh versions/ || true

      - name: Download GPL licenses (for the GPL-licensed third-party binaries)
        run: |
          mkdir -p licenses
          if [ ! -f licenses/GPL-2.0.txt ]; then
            echo "Downloading GPL-2.0..."
            curl -sS https://www.gnu.org/licenses/old-licenses/gpl-2.0.txt -o licenses/GPL-2.0.txt
          fi
          if [ ! -f licenses/GPL-3.0.txt ]; then
            echo "Downloading GPL-3.0..."
            curl -sS https://www.gnu.org/licenses/gpl-3.0.txt -o licenses/GPL-3.0.txt
          fi

      # Packages the gpm binary built by this workflow (not a committed copy)
      - name: Build ZimaOS RAW package
        run: |
          sudo apt-get update && sudo apt-get install -y squashfs-tools
          bash zpkg/build-zpkg.sh release-files/gpm release-files/gpm.raw
          echo "Added gpm.raw to release files"

      - name: Copy compliance files
        run: |
          cp SOURCES.txt release-files/
          cp COPYING release-files/
          cp -r licenses release-files/
          # Glochidia's own code (gpm, set_locale, build tooling) is MIT OR Apache-2.0
          cp LICENSE-MIT LICENSE-APACHE release-files/licenses/

      # Decided before the manifest is generated so its download URLs point at the
      # release actually being created (a v* tag push publishes under that tag)
      - name: Determine release version
        id: release-version
        env:
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [ -n "${INPUT_RELEASE_TAG}" ]; then
            # Use explicitly provided tag from workflow dispatch
            VERSION="${INPUT_RELEASE_TAG}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # Use tag from push event (e.g., v1.0.0)
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            # Push to master branch always uses "latest"
            VERSION="latest"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION}"

      - name: Generate manifest with Python
        env:
          RELEASE_TAG: ${{ steps.release-version.outputs.version }}
        run: |
          python3 scripts/generate-manifest.py "${GITHUB_REPOSITORY}" "${RELEASE_TAG}" "${REPO_VERSION}"
          echo ""
          echo "Final release files:"
          ls -lh release-files/
          echo ""
          echo "Manifest SHA256 checksums:"
          grep '"sha256"' release-files/manifest.json

      - name: Generate release body
        env:
          RELEASE_TAG: ${{ steps.release-version.outputs.version }}
        run: |
          case "${GITHUB_EVENT_NAME}:${GITHUB_REF}" in
            workflow_dispatch:*) BUILD_INFO="manually" ;;
            push:refs/tags/*) BUILD_INFO="from tag push" ;;
            *) BUILD_INFO="from push to ${GITHUB_REF_NAME}" ;;
          esac
          python3 scripts/generate-release-body.py "${GITHUB_REPOSITORY}" "${RELEASE_TAG}" "${BUILD_INFO}" "${GITHUB_SHA}"
          cat release-body.md

      # action-gh-release only creates a tag when it is missing and never moves an existing
      # one, so the rolling "latest" tag would stay on the commit of the first build.
      # Point it at this commit before updating the release.
      - name: Move latest tag to this commit
        if: steps.release-version.outputs.version == 'latest'
        run: |
          git tag -f latest "${GITHUB_SHA}"
          git push -f origin refs/tags/latest

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: ${{ steps.release-version.outputs.version == 'latest' }}
          name: Release ${{ steps.release-version.outputs.version }}
          body_path: release-body.md
          files: |
            release-files/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub never changes a release's published date when the release is updated, so the
      # rolling latest release kept showing the date of its first build. Switching it to
      # draft and back re-publishes it, which resets the date. Tag and assets are kept, and
      # downloads kept working throughout when this was tested. Publishing is retried so a
      # transient API error cannot leave the release hidden as a draft.
      - name: Refresh latest release publish date
        if: steps.release-version.outputs.version == 'latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit latest -R "${GITHUB_REPOSITORY}" --draft=true
          for attempt in 1 2 3 4 5; do
            if gh release edit latest -R "${GITHUB_REPOSITORY}" --draft=false --latest; then
              gh release view latest -R "${GITHUB_REPOSITORY}" --json publishedAt -q '"Published: " + .publishedAt'
              exit 0
            fi
            echo "Publishing failed (attempt ${attempt}), retrying..."
            sleep $((attempt * 2))
          done
          echo "Error: latest release was left as a draft"
          exit 1
